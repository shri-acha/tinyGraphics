<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poly Fishes</title>
  <style>
    :root {
      --bg: #04121f;
      --fg: #d7eef7;
      --muted: #7fa3b5;
      --accent: #4fd1e6;
      --frame: #0b2a40;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: radial-gradient(ellipse at top, #0a2d47 0%, var(--bg) 70%);
      color: var(--fg);
      font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      gap: 16px;
    }
    h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: .02em; }
    h1 span { color: var(--accent); }
    .stage {
      width: min(100%, 960px);
      aspect-ratio: 16 / 9;
      border: 2px solid var(--frame);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
      background: #000;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: crosshair;
    }
    p { margin: 0; color: var(--muted); max-width: 960px; text-align: center; }
    #status { color: var(--accent); }
  </style>
</head>
<body>
  <h1>tinyGraphics <span>· WebAssembly</span></h1>
  <div class="stage"><canvas id="canvas" width="480" height="270" oncontextmenu="event.preventDefault()"></canvas></div>
  <p>Every pixel is rasterized on the CPU by tinyGraphics (C → WASM) into an RGB565 framebuffer. The browser only displays it. Click to release bubbles.</p>
  <p id="status">loading…</p>

  <script>
    var Module = {
      canvas: document.getElementById('canvas'),
      onRuntimeInitialized: function () { document.getElementById('status').textContent = ''; },
      printErr: function (t) { console.error(t); }
    };
  </script>
  <script src="fishes.js"></script>
</body>
</html>
